services:
  postgresql:
    image: postgres:17
    networks:
      - CapstoneEsEvents
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    networks:
      - CapstoneEsEvents
    ports:
      - "127.0.0.1:9042:9042"
      - "127.0.0.1:9160:9160"
    environment:
      CASSANDRA_CLUSTER_NAME: "ESEvents"
      CASSANDRA_NUM_TOKENS: 256
      CASSANDRA_LISTEN_ADDRESS: cassandra
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_SEEDS: cassandra
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspace system"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  mailpit:
    # Development mail catcher: accepts any mail on SMTP 1025 (internal only) and shows it at http://localhost:8025.
    # Replace with a real SMTP provider (Email__Host etc.) in production.
    image: axllent/mailpit:v1.33.0
    networks:
      - CapstoneEsEvents
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  userapi:
    build:
      context: .
      dockerfile: src/ESEvents.Web/Dockerfile
    networks:
      - CapstoneEsEvents
    expose:
      - "8080"
    volumes:
      - dataprotectionkeys:/var/dpkeys
    environment:
      ConnectionStrings__Default: Host=postgresql;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Email__Host: mailpit
      Email__Port: "1025"
    depends_on:
      postgresql:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    networks:
      - CapstoneEsEvents
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - userapi
    restart: unless-stopped

volumes:
  pgdata:
  cassandradata:
  dataprotectionkeys:

networks:
  CapstoneEsEvents:
    name: CapstoneEsEvents
