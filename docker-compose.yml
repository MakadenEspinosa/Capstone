services:
  postgresql:
    image: postgres:17
    networks:
      - CapstoneEsEvents
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  userapi:
    build:
      context: .
      dockerfile: src/ESEvents.Web/Dockerfile
    networks:
      - CapstoneEsEvents
    expose:
      - "8080"
    environment:
      ConnectionStrings__Default: Host=postgresql;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    networks:
      - CapstoneEsEvents
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - userapi
    restart: unless-stopped

volumes:
  pgdata:

networks:
  CapstoneEsEvents:
    name: CapstoneEsEvents